<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="ax-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#0088ff" />
    </linearGradient>
    <linearGradient id="ax-magenta" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff0055" />
      <stop offset="100%" stop-color="#b800ff" />
    </linearGradient>
    <filter id="ax-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Obsidian Cyber Shield Base -->
  <polygon
    points="18,8 102,8 114,24 114,96 98,112 16,112 6,98 6,22"
    fill="#05050a"
    stroke="#00f0ff"
    stroke-width="2.5"
    stroke-opacity="0.55"
  />

  <!-- Left 'A' Cyber Wing (Neon Cyan) -->
  <path
    d="M14 98 L48 22 H64 L54 44 L36 84 H56 L50 96 H30 L22 106 Z"
    fill="url(#ax-cyan)"
    filter="url(#ax-glow)"
  />
  <!-- Inner 'A' Cutout / Crossbar Highlight -->
  <path
    d="M39 68 L49 44 L58 68 Z"
    fill="#05050a"
  />

  <!-- Right 'X' Cyber Blade Slash (Electric Magenta + Cyan Edge) -->
  <path
    d="M54 24 H70 L106 94 H90 Z"
    fill="url(#ax-magenta)"
    filter="url(#ax-glow)"
  />
  <path
    d="M108 14 L52 98 H68 L112 28 Z"
    fill="url(#ax-cyan)"
    filter="url(#ax-glow)"
  />
  <!-- Center Energy Core Intersection -->
  <polygon
    points="69,51 79,51 73,65 63,65"
    fill="#fcee0a"
  />
</svg>
